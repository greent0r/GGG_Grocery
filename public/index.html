<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f6fa"><meta name="description" content="GGG杂货铺"><title>GGG杂货铺</title><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"></head><body>
<header><a class="brand" href="./">GGG<span>杂货铺</span></a></header>
<main><section id="shelf"><div class="shelf-heading"><div><div class="label">货架 / 01</div><h1>相片<span id="count">00</span></h1></div><div class="geometry" aria-hidden="true"><div class="bar"></div><div class="orbit"><span></span></div><div class="triangle"></div><div class="square"></div></div></div><p id="loading" role="status">加载中…</p><div id="failure" role="alert" hidden><p>照片加载失败。</p><button id="retry" class="hard">重试</button></div><div id="grid" class="grid"></div><div id="empty" class="empty" hidden><span>暂无照片</span></div></section></main>
<dialog id="viewer" aria-label="照片详情"><button class="close" aria-label="关闭">×</button><div class="viewer-layout"><img id="full-photo" alt=""><aside class="photo-info" aria-label="照片信息"><h2 id="photo-title"></h2><dl id="camera-details"></dl><p id="no-exif" hidden>照片未包含相机参数。</p><dl id="file-details"></dl><div class="photo-actions"><a id="original" target="_blank" rel="noopener">查看原图 ↗</a></div></aside></div></dialog><script src="./app.js"></script></body></html>
